version: 2

models:
  - name: int_calendar
    description: "One row per calendar day in the analysis window (vars calendar_start / calendar_end)."
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: int_athlete_day_spine
    description: "Dense athlete x day grain from each athlete's signing date. Required for correct rolling windows."
    data_tests:
      - unique_combination:
          arguments: {combination_of_columns: [athlete_id, date_day]}

  - name: int_daily_training_load
    description: "Sessions aggregated to athlete x day (only days with at least one session)."
    data_tests:
      - unique_combination:
          arguments: {combination_of_columns: [athlete_id, date_day]}

  - name: int_match_form
    description: "Rolling 5-match average rating at each match (includes the match itself; lagged later)."

  - name: int_team_schedule
    description: "Team x day with match-day flag and fixtures scheduled in the next 7 days."
    data_tests:
      - unique_combination:
          arguments: {combination_of_columns: [team_id, date_day]}

  - name: int_athlete_day_base
    description: "Every signal joined to the dense spine; zero-filled load, nullable recovery/nutrition."
    data_tests:
      - unique_combination:
          arguments: {combination_of_columns: [athlete_id, date_day]}
    columns:
      - name: is_unavailable
        data_tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}

  - name: int_rolling_features
    description: >
      Rolling-window feature engineering with an explicit timing convention (see macros/windows.sql):
      load and nutrition use data through YESTERDAY, sleep and HRV include this morning, labels look forward.
    data_tests:
      - unique_combination:
          arguments: {combination_of_columns: [athlete_id, date_day]}
    columns:
      - name: acwr
        description: "Acute (7d) : chronic (28d) mean daily load, both ending yesterday."
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 10}
      - name: injury_next_7d
        description: "LABEL. 1 if a time-loss injury starts today or in the next 6 days."
        data_tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}

unit_tests:
  - name: rolling_load_windows_exclude_today
    description: >
      Anti-leakage check. On day 9 the acute load must be the mean of days 2-8 (NOT including day 9),
      and the chronic load the mean of every prior day available.
    model: int_rolling_features
    given:
      - input: ref('int_athlete_day_base')
        rows:
          - {athlete_id: A1, date_day: 2025-01-01, day_index: 1, daily_load: 100, injury_onset: 0, is_unavailable: 0}
          - {athlete_id: A1, date_day: 2025-01-02, day_index: 2, daily_load: 200, injury_onset: 0, is_unavailable: 0}
          - {athlete_id: A1, date_day: 2025-01-03, day_index: 3, daily_load: 300, injury_onset: 0, is_unavailable: 0}
          - {athlete_id: A1, date_day: 2025-01-04, day_index: 4, daily_load: 400, injury_onset: 0, is_unavailable: 0}
          - {athlete_id: A1, date_day: 2025-01-05, day_index: 5, daily_load: 500, injury_onset: 0, is_unavailable: 0}
          - {athlete_id: A1, date_day: 2025-01-06, day_index: 6, daily_load: 600, injury_onset: 0, is_unavailable: 0}
          - {athlete_id: A1, date_day: 2025-01-07, day_index: 7, daily_load: 700, injury_onset: 0, is_unavailable: 0}
          - {athlete_id: A1, date_day: 2025-01-08, day_index: 8, daily_load: 800, injury_onset: 0, is_unavailable: 0}
          - {athlete_id: A1, date_day: 2025-01-09, day_index: 9, daily_load: 900, injury_onset: 0, is_unavailable: 0}
      - input: ref('int_match_form')
        rows: []
    expect:
      rows:
        - {date_day: 2025-01-01, acute_load_7d: null, chronic_load_28d: null}
        - {date_day: 2025-01-02, acute_load_7d: 100,  chronic_load_28d: 100}
        - {date_day: 2025-01-03, acute_load_7d: 150,  chronic_load_28d: 150}
        - {date_day: 2025-01-04, acute_load_7d: 200,  chronic_load_28d: 200}
        - {date_day: 2025-01-05, acute_load_7d: 250,  chronic_load_28d: 250}
        - {date_day: 2025-01-06, acute_load_7d: 300,  chronic_load_28d: 300}
        - {date_day: 2025-01-07, acute_load_7d: 350,  chronic_load_28d: 350}
        - {date_day: 2025-01-08, acute_load_7d: 400,  chronic_load_28d: 400}
        - {date_day: 2025-01-09, acute_load_7d: 500,  chronic_load_28d: 450}
