# Two targets, same models:
#   dev        -> DuckDB file (free, used in CI and for local development)
#   snowflake  -> production warehouse (set SNOWFLAKE_* env vars)
#
#   dbt build --target dev
#   dbt build --target snowflake
athlete_ams:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/athlete.duckdb') }}"
      threads: 4

    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_DBT_ROLE', 'AMS_TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'AMS_TRANSFORM_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'ATHLETE_DB') }}"
      schema: STAGING
      threads: 8
      client_session_keep_alive: false
